<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — HAIBO Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-auth-pending admin-login-page">
  <div id="admin-auth-loading" class="admin-auth-loading" aria-live="polite" aria-busy="true">
    <div class="admin-auth-loading__inner">
      <div class="admin-auth-loading__spinner" aria-hidden="true"></div>
      <p data-auth-loading-msg>Checking session…</p>
    </div>
  </div>

  <div class="admin-login-wrap">
    <div class="admin-login-bg" aria-hidden="true"></div>
    <form id="login-form" class="admin-login-card">
      <div class="admin-login-brand">
        <span class="admin-login-brand__mark">H</span>
        <div>
          <strong>HAIBO CMS</strong>
          <span>Tours & Safaris</span>
        </div>
      </div>
      <p class="admin-muted admin-login-tagline">Secure content management for your luxury tourism website</p>
      <div class="admin-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@haibotours.com" />
      </div>
      <div class="admin-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="admin-btn admin-btn--primary admin-btn--block">
        <span>Sign in to dashboard</span>
      </button>
      <p id="login-error" class="admin-login-error" role="alert"></p>
      <p class="admin-muted admin-login-foot"><a href="/">← Back to website</a></p>
    </form>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script type="module" src="/admin/js/admin-login.mjs"></script>
</body>
</html>
