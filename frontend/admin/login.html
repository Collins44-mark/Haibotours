<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — HAIBO Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-auth-pending">
  <div id="admin-auth-loading" class="admin-auth-loading" aria-live="polite" aria-busy="true">
    <div class="admin-auth-loading__inner">
      <div class="admin-auth-loading__spinner" aria-hidden="true"></div>
      <p data-auth-loading-msg>Checking session…</p>
    </div>
  </div>
  <div class="admin-login-wrap">
    <form id="login-form" class="admin-login-card">
      <h1 style="color:#d98b2b;margin:0 0 0.5rem">HAIBO Admin</h1>
      <p class="admin-muted" style="margin-bottom:1.5rem">Secure content management</p>
      <div class="admin-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="admin-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="admin-btn admin-btn--primary" style="width:100%;margin-top:0.5rem">Sign in</button>
      <p id="login-error" class="admin-muted" style="margin-top:1rem;color:#f87171"></p>
    </form>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script type="module" src="js/admin-login.mjs"></script>
</body>
</html>
