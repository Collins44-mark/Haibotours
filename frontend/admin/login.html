<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=/admin" />
  <title>Redirect — HAIBO Admin</title>
  <script>
    (function () {
      var local =
        location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      location.replace(local ? '/admin/index.html' : '/admin');
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:2rem">
    <a href="/admin">Continue to HAIBO Admin</a>
  </p>
</body>
</html>
